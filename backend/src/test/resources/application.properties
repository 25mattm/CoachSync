# Test profile: in-memory H2 (MySQL compatibility mode) so the Spring context
# boots and Hibernate validates every mapping offline — no MySQL server needed.
# The MySQL-dialect DDL for human review is produced separately by
# SchemaExportTest (target/generated-schema-mysql.sql).
spring.datasource.url=jdbc:h2:mem:coachsync;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mirror the main profile so framework errors render as problem+json in tests too.
spring.mvc.problemdetails.enabled=true
spring.jpa.properties.hibernate.jdbc.batch_size=30

# Auth keys (this file REPLACES the main application.properties on the test
# classpath). The HS256 secret must be present and ≥ 32 bytes; the Apple verifier
# is mocked in tests, so its JWKS URI is never hit.
coachsync.auth.jwt.secret=test-only-coachsync-jwt-secret-which-is-long-enough-for-hs256
coachsync.auth.jwt.issuer=coachsync-backend
coachsync.auth.jwt.ttl=30d
coachsync.auth.apple.issuer=https://appleid.apple.com
coachsync.auth.apple.jwks-uri=https://appleid.apple.com/auth/keys
coachsync.auth.apple.client-ids=com.example.CoachSync,com.example.CoachSyncMac
# Approved-coach allowlist for the auth tests (the mocked verifier returns this email).
coachsync.auth.allowed-emails=pat@example.com
