spring.application.name=coachsync-backend

# --- Datasource (MySQL) -------------------------------------------------------
# Supply real values via environment variables for live runs; defaults target a
# local MySQL named "coachsync".
spring.datasource.url=${COACHSYNC_DB_URL:jdbc:mysql://localhost:3306/coachsync}
spring.datasource.username=${COACHSYNC_DB_USER:root}
spring.datasource.password=${COACHSYNC_DB_PASSWORD:}

# --- JPA / Hibernate ----------------------------------------------------------
# Never auto-mutate a real database. The schema is reviewed via SchemaExportTest
# (generates target/generated-schema-mysql.sql) and applied deliberately.
# For an exploratory live run against a throwaway MySQL, override on the command
# line: -Dspring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Web ---
# Emit RFC 9457 application/problem+json for framework-raised exceptions too, so
# the error contract is consistent with GlobalExceptionHandler.
spring.mvc.problemdetails.enabled=true

# --- Health endpoint (unauthenticated — see SecurityConfig) --------------------
# ONLY /actuator/health is exposed. Never env/beans/loggers/heapdump: those would
# hand an anonymous caller the datasource URL and the rest of the configuration.
# show-details/show-components=never keeps the body a bare {"status":"UP"} while the
# auto-registered DataSource indicator still flips the overall status — so a dead
# database answers 503 without disclosing the driver, schema, or host. That 503 is
# what separates "app up, database down" from "app never started", which answers
# nothing at all and is how the 2026-07-09 outage hid for weeks.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Batch the per-rep slot inserts/deletes the reconcile path produces.
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Auth (Sign in with Apple + our own JWT) ----------------------------------
# Apple identity tokens are validated against Apple's JWKS, requiring
# iss=appleid.apple.com and aud in the configured client (bundle) IDs.
coachsync.auth.apple.issuer=https://appleid.apple.com
coachsync.auth.apple.jwks-uri=https://appleid.apple.com/auth/keys
coachsync.auth.apple.client-ids=com.example.CoachSync,com.example.CoachSyncMac

# Our own session token (HS256). The secret MUST be overridden in any real
# deployment via COACHSYNC_JWT_SECRET — the inline default is insecure and dev-only.
coachsync.auth.jwt.secret=${COACHSYNC_JWT_SECRET:dev-only-insecure-coachsync-jwt-secret-change-me-in-production}
coachsync.auth.jwt.issuer=coachsync-backend
coachsync.auth.jwt.ttl=30d

# --- Access control (platform-operator allowlist) ------------------------------
# NOT a sign-in gate any more (multi-club tenancy slice 4): any verified Apple ID
# may sign in and is provisioned club-less/pending. This list instead gates the
# two operator-only endpoints (OperatorGuard) — POST /api/clubs (create a club)
# and POST /api/coaches/{id}/approve (approve a pending coach into one). ONLY
# these emails may call them. Set COACHSYNC_ALLOWED_EMAILS to a comma-separated
# list (INCLUDING your own) before creating any club. See DEPLOY.md.
coachsync.auth.allowed-emails=${COACHSYNC_ALLOWED_EMAILS:}
