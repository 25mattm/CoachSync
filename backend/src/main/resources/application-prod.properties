# Production profile — activate with SPRING_PROFILES_ACTIVE=prod (the Dockerfile sets it).
# Inherits application.properties; everything sensitive comes from environment variables
# (COACHSYNC_DB_URL / COACHSYNC_DB_USER / COACHSYNC_DB_PASSWORD / COACHSYNC_JWT_SECRET — see
# DEPLOY.md). This file only tightens the dev defaults that are unsafe or noisy in production.

# Don't log SQL or echo statements in production (performance, and avoids leaking row data to logs).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=warn

# Never let Hibernate mutate the schema — it is applied deliberately from deploy/schema-mysql.sql.
spring.jpa.hibernate.ddl-auto=none

# TLS is terminated by the platform / reverse proxy in front of the app, which forwards the
# X-Forwarded-* headers. Honor them so request scheme and the 201 Location headers are https.
server.forward-headers-strategy=framework

# The platform assigns the port via $PORT (Render, most PaaS); bind to it, falling back to 8080 locally.
server.port=${PORT:8080}

# --- API docs (springdoc / Swagger UI) ----------------------------------------
# Disabled in production: the generated spec enumerates every endpoint + DTO and is served WITHOUT
# auth (SecurityConfig permits the docs paths). It's a dev/test aid, not for the public prod surface.
# With both off, the permitted /v3/api-docs and /swagger-ui paths simply resolve to 404 in prod.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
